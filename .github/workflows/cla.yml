name: cla

# Outside contributions are accepted only under CLA.md, so that later releases
# can change licence without asking every past contributor. The bot asks each
# new author to sign once by comment and records the signature on the
# cla-signatures branch, which keeps bot commits off main.
#
# pull_request_target runs with this repository's token, so this job must never
# check out or execute code from the pull request. The action only reads the
# PR's commit authors through the API.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # v2.6.1, pinned by commit because this job holds a write token.
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/rootstudioyaml/sprag/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: rootstudioyaml,dependabot[bot],github-actions[bot]
