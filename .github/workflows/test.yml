name: test

on:
  push:
    branches: [main]
  pull_request:

# A newer push supersedes the run before it. Cancelling a stuck run needs a
# write to api.github.com, which some networks block; this way a push is enough.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The tool reads Claude Code transcripts and writes user-level config, so
    # the cross-platform path handling (XDG / APPDATA / Application Support)
    # is exactly what a single-OS run would fail to catch.
    runs-on: ${{ matrix.os }}
    # The suite takes about a minute per OS. Without a limit a hung child
    # process holds a runner for the six-hour default, and its log stays
    # unreadable until then; 20 minutes let the 2026-10 Windows hang burn
    # nineteen of them on every push before anyone saw a log.
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm test
      # The smoke check proves the CLI boots and its subcommands parse.
      # Exercises every subcommand against an isolated home. The Windows
      # failures this project has shipped were all of this shape: a home
      # resolved from the wrong variable, a file:// URL used as a path, a
      # subcommand with no dispatch behind it.
      - run: node scripts/verify-cli.mjs

  # The conversion path is the part that is only real per-OS: building the
  # venv, resolving an interpreter (`py -3` on Windows), installing the .fig
  # parser through npm (npm.cmd there), and converting an actual document.
  # None of that is exercised by the unit suite, and all of it is what a
  # company rollout hits first.
  doc2md:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # markitdown needs 3.10+; the runner images ship several, and this
      # pins the one the check runs against.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: node scripts/verify-doc2md.mjs

  # The mods' own tests (mod/*/tests/*.test.tsx) run inside Claude Code's
  # plugin kit, which `node --test` cannot load, so they need the claude CLI.
  # `claude plugin test` raises the events itself: no login, model or network.
  # One OS is enough, since the mods reach the machine only through the engine.
  mods:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: npm run test:mods
