name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The tool reads Claude Code transcripts and writes user-level config, so
    # the cross-platform path handling (XDG / APPDATA / Application Support)
    # is exactly what a single-OS run would fail to catch.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      # No dependencies to install — the smoke check just proves the CLI still
      # boots and its subcommands parse on this platform.
      - run: node bin/cli.js --statusline --no-color --days 1
      - run: node bin/cli.js --demo table
