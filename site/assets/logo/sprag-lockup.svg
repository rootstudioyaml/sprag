<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 64" width="250" height="64" role="img" aria-label="Sprag">
  <title>Sprag</title>
  <defs>
    <!-- one cam: a slab leaning off-radius. The lean is the one-way tell. -->
    <g id="sprag-cam">
      <rect x="26.5" y="9.5" width="11" height="15" rx="3.6" transform="rotate(-30 32 17)"/>
    </g>
  </defs>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#59637A" stroke-width="6"/>
  <g fill="#FFB020">
    <use href="#sprag-cam"/>
    <use href="#sprag-cam" transform="rotate(120 32 32)"/>
    <use href="#sprag-cam" transform="rotate(240 32 32)"/>
  </g>
  <circle cx="32" cy="32" r="8.5" fill="none" stroke="#59637A" stroke-width="4"/>

  <text x="76" y="43" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="31"
        font-weight="800" letter-spacing="5" fill="#F2F3F6">SPRAG</text>
</svg>
